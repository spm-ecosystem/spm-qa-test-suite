<!DOCTYPE html><html><head>
  <title>GitHub Mock Issues</title>
<style id="spm-injected-theme-styles">:root {
  --spm-accent: #58a6ff;
  --spm-bg-element: #21262d;
  --spm-bg-primary: #0d1117;
  --spm-bg-surface: #161b22;
  --spm-border-contrast: rgba(240, 246, 252, 0.1);
  --spm-radius: 6px;
  --spm-text-muted: #8b949e;
  --spm-text-primary: #c9d1d9;
}

body { background-color: #0d1117 !important; font-family: -apple-system,BlinkMacSystemFont,`Segoe UI`,Helvetica,Arial,sans-serif !important; }</style></head>
<body>
  <div class="repo-header" style="display: none;" data-spm-hidden="true">Legacy Repo Header</div>

  <div id="searchform">
    <form action="/search" style="display: none;">
      <input type="text" name="q" placeholder="Search...">
    </form>
  <spm-reconstruct-host layout="UiSearchBar" selector="#searchform"></spm-reconstruct-host></div>

  <div id="issues-container">
    <div class="js-issue-row" data-labels="bug,documentation" style="display: none;">
      <span class="issue-number">#101</span>
      <a class="issue-title" href="/issues/101">Fix compilation crash in C++ CLI</a>
      <span class="comment-count">4</span>
    </div>
    <div class="js-issue-row" data-labels="feature,discussion" style="display: none;">
      <span class="issue-number">#102</span>
      <a class="issue-title" href="/issues/102">Add support for space-delimited tags split</a>
      <span class="comment-count">12</span>
    </div>
  <spm-reconstruct-host layout="UiTableListPage" selector="#issues-container"></spm-reconstruct-host></div>

  <footer style="display: none;" data-spm-hidden="true">Legacy Footer</footer>


</body></html>
