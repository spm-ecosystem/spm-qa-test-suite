<!DOCTYPE html><html><head>
  <title>StackOverflow Mock Questions</title>
<style id="spm-injected-theme-styles">:root {
  --spm-accent: #0074cc;
  --spm-bg-element: #e1ecf4;
  --spm-bg-primary: #ffffff;
  --spm-bg-surface: #f8f9fa;
  --spm-border-contrast: rgba(0, 0, 0, 0.08);
  --spm-radius: 4px;
  --spm-text-muted: #6a737c;
  --spm-text-primary: #232629;
}

body { background-color: #ffffff !important; font-family: -apple-system,BlinkMacSystemFont,`Segoe UI`,Helvetica,Arial,sans-serif !important; }</style></head>
<body>
  <div id="community-bulletins" style="display: none;" data-spm-hidden="true">Legacy Community Bulletin</div>

  <div id="searchform">
    <form action="/search" style="display: none;">
      <input type="text" name="q" placeholder="Search...">
    </form>
  <spm-reconstruct-host layout="UiSearchBar" selector="#searchform"></spm-reconstruct-host></div>

  <div id="questions-container">
    <div class="question-summary" id="q-12345" data-tags="javascript react" style="display: none;">
      <span class="vote-count-post">150</span>
      <a class="question-hyperlink" href="/questions/12345">How to implement split pipe in Veneer Spec?</a>
      <div class="views">2.4k views</div>
    </div>
    <div class="question-summary" id="q-67890" data-tags="cpp parsing" style="display: none;">
      <span class="vote-count-post">42</span>
      <a class="question-hyperlink" href="/questions/67890">Parsing custom delimiters in C++ CLI</a>
      <div class="views">12,500 views</div>
    </div>
  <spm-reconstruct-host layout="UiTableListPage" selector="#questions-container"></spm-reconstruct-host></div>

  <div id="sidebar" style="display: none;" data-spm-hidden="true">Legacy Sidebar</div>


</body></html>
